<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internet Archive MP4 Search</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#121212;
    color:#fff;
    margin:30px;
}
h1{
    color:#4fc3f7;
}
input{
    width:70%;
    padding:12px;
    font-size:16px;
    border:none;
    border-radius:6px;
}
button{
    padding:12px 18px;
    font-size:16px;
    border:none;
    border-radius:6px;
    background:#4fc3f7;
    cursor:pointer;
}
button:hover{
    background:#29b6f6;
}
.result{
    background:#1f1f1f;
    padding:15px;
    margin-top:15px;
    border-radius:8px;
}
video{
    max-width:100%;
    margin-top:10px;
}
a{
    color:#81d4fa;
}
</style>
</head>
<body>

<h1>Internet Archive MP4 Search</h1>

<p>Search for videos by keyword.</p>

<input id="search" placeholder="minecraft">
<button onclick="searchVideos()">Search</button>

<div id="results"></div>

<script>
async function searchVideos(){

    const term=document.getElementById("search").value.trim();

    if(!term){
        alert("Enter a search term.");
        return;
    }

    const results=document.getElementById("results");
    results.innerHTML="<p>Searching...</p>";

    const api="https://archive.org/advancedsearch.php?q="+
        encodeURIComponent(term+" AND mediatype:movies")+
        "&fl[]=identifier,title&rows=30&page=1&output=json";

    try{

        const res=await fetch(api);
        const data=await res.json();

        let html="";

        for(const item of data.response.docs){

            try{

                const meta=await fetch("https://archive.org/metadata/"+item.identifier);
                const metadata=await meta.json();

                if(!metadata.files) continue;

                for(const file of metadata.files){

                    if(file.name && file.name.toLowerCase().endsWith(".mp4")){

                        const url="https://archive.org/download/"
                            +item.identifier+"/"
                            +encodeURIComponent(file.name);

                        html+=`
                        <div class="result">
                            <h3>${item.title || item.identifier}</h3>
                            <a href="${url}" target="_blank">${file.name}</a><br><br>
                            <video controls src="${url}"></video>
                        </div>
                        `;

                    }

                }

            }catch(e){}

        }

        if(html===""){
            html="<p>No MP4 files found.</p>";
        }

        results.innerHTML=html;

    }catch(err){

        results.innerHTML="<p>Error: "+err+"</p>";

    }

}
</script>

</body>
</html>
