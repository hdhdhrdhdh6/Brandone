<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayback MP4 Finder</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    margin:40px;
}
input{
    width:70%;
    padding:10px;
    font-size:16px;
}
button{
    padding:10px 18px;
    font-size:16px;
    cursor:pointer;
}
.result{
    margin-top:20px;
    padding:12px;
    background:#222;
    border-radius:8px;
}
a{
    color:#4fc3ff;
}
small{
    color:#aaa;
}
</style>
</head>
<body>

<h2>Wayback Machine MP4 Finder</h2>

<p>Enter a URL or directory.</p>

<input id="url" placeholder="https://example.com/videos/">
<button onclick="search()">Search</button>

<div id="results"></div>

<script>

async function search(){

    let input=document.getElementById("url").value.trim();

    if(!input){
        alert("Enter a URL");
        return;
    }

    if(!input.endsWith("*")){
        if(!input.endsWith("/"))
            input+="/";
        input+="*";
    }

    const api=
"https://web.archive.org/cdx/search/cdx?url="+
encodeURIComponent(input)+
"&output=json&fl=timestamp,original,statuscode,mimetype&filter=mimetype:video/mp4";

    const results=document.getElementById("results");
    results.innerHTML="Searching...";

    try{

        const res=await fetch(api);

        const data=await res.json();

        if(data.length<=1){
            results.innerHTML="<p>No MP4 archives found.</p>";
            return;
        }

        let html="<h3>Results</h3>";

        for(let i=1;i<data.length;i++){

            let row=data[i];

            let timestamp=row[0];
            let original=row[1];
            let status=row[2];

            let archive="https://web.archive.org/web/"+timestamp+"/"+original;

            html+=`
            <div class="result">
            <a href="${archive}" target="_blank">${original}</a><br>
            <small>${timestamp} | HTTP ${status}</small>
            </div>
            `;
        }

        results.innerHTML=html;

    }catch(e){
        results.innerHTML="Error: "+e;
    }

}

</script>

</body>
</html>
