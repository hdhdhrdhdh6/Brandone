<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MP3 Joiner</title>
<style>
body{
    font-family:Arial,sans-serif;
    max-width:700px;
    margin:40px auto;
    padding:20px;
}
button{
    padding:10px 20px;
    margin-top:10px;
}
#status{
    margin-top:20px;
    white-space:pre-wrap;
}
</style>
</head>
<body>

<h2>MP3 Joiner</h2>

<input type="file" id="files" accept=".mp3,audio/mpeg" multiple>
<br>
<button id="merge">Merge & Download</button>

<div id="status"></div>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>

<script>
const status = document.getElementById("status");

function log(msg){
    status.textContent += msg + "\n";
}

document.getElementById("merge").onclick = async () => {

    status.textContent="";

    const fileInput=document.getElementById("files");

    if(fileInput.files.length===0){
        alert("Choose some MP3 files.");
        return;
    }

    const audioCtx=new AudioContext();

    const buffers=[];

    for(const file of fileInput.files){
        log("Loading "+file.name);
        const arr=await file.arrayBuffer();
        const buf=await audioCtx.decodeAudioData(arr);
        buffers.push(buf);
    }

    const sampleRate=buffers[0].sampleRate;
    const channels=Math.min(2,buffers[0].numberOfChannels);

    let totalLength=0;

    buffers.forEach(b=>{
        totalLength+=b.length;
    });

    const output=audioCtx.createBuffer(
        channels,
        totalLength,
        sampleRate
    );

    let offset=0;

    for(const b of buffers){
        for(let c=0;c<channels;c++){
            output.getChannelData(c).set(
                b.getChannelData(c),
                offset
            );
        }
        offset+=b.length;
    }

    log("Encoding MP3...");

    const mp3encoder=new lamejs.Mp3Encoder(
        channels,
        sampleRate,
        192
    );

    const samples=1152;
    const mp3Data=[];

    if(channels===1){

        const left=output.getChannelData(0);

        for(let i=0;i<left.length;i+=samples){

            const chunk=left.subarray(i,i+samples);

            const pcm=new Int16Array(chunk.length);

            for(let j=0;j<chunk.length;j++){
                let s=Math.max(-1,Math.min(1,chunk[j]));
                pcm[j]=s<0?s*32768:s*32767;
            }

            const mp3buf=mp3encoder.encodeBuffer(pcm);

            if(mp3buf.length)
                mp3Data.push(new Uint8Array(mp3buf));
        }

    }else{

        const left=output.getChannelData(0);
        const right=output.getChannelData(1);

        for(let i=0;i<left.length;i+=samples){

            const lChunk=left.subarray(i,i+samples);
            const rChunk=right.subarray(i,i+samples);

            const lPCM=new Int16Array(lChunk.length);
            const rPCM=new Int16Array(rChunk.length);

            for(let j=0;j<lChunk.length;j++){

                let l=Math.max(-1,Math.min(1,lChunk[j]));
                let r=Math.max(-1,Math.min(1,rChunk[j]));

                lPCM[j]=l<0?l*32768:l*32767;
                rPCM[j]=r<0?r*32768:r*32767;
            }

            const mp3buf=mp3encoder.encodeBuffer(lPCM,rPCM);

            if(mp3buf.length)
                mp3Data.push(new Uint8Array(mp3buf));
        }
    }

    const end=mp3encoder.flush();

    if(end.length)
        mp3Data.push(new Uint8Array(end));

    const blob=new Blob(mp3Data,{type:"audio/mpeg"});

    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="merged.mp3";
    a.click();

    URL.revokeObjectURL(a.href);

    log("Done!");
};
</script>

</body>
</html>
